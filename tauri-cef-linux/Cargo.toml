[package]
name = "pnltracker-desktop-cef"
version = "0.1.3"
description = "PnlTracker desktop application (CEF runtime)"
authors = ["PnlTracker"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pnltracker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[features]
desktop-production = ["dep:getrandom"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.5", features = ["devtools", "unstable"] }
tauri-runtime-cef = "3.0.0-alpha.6"
tauri-plugin-log = "3.0.0-alpha.3"
getrandom = { version = "0.3.4", optional = true }
tauri-plugin-shell = "3.0.0-alpha.3"
tauri-plugin-single-instance = "3.0.0-alpha.3"
# xdg-portal : évite le backend rfd/gtk3 qui charge libgtk-3 en conflit avec GTK4
tauri-plugin-dialog = { version = "3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
x11-dl = "2.21.0"

[target.'cfg(target_os = "linux")'.dependencies]
postgresql_embedded = { version = "0.21.0", features = ["blocking", "bundled"] }
libc = "0.2.189"

# Désactiver les symboles de debug (.pdb) en release pour réduire la taille
[profile.release]
debug = false

# Les crates v3 alpha et les plugins sont désormais publiés sur crates.io — plus
# besoin du patch git (l'ancien pin 72025a3a7 évitait le breaking change
# Manager::run_on_main_thread d'alpha.3 ; corrigé dans tauri-plugin-dialog alpha.4).
